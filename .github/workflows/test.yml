name: Offline tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test host SDK (not bundled runtime dependencies)
        run: npm install --no-save --package-lock=false --ignore-scripts @earendil-works/pi-ai@1.5.0 @earendil-works/pi-coding-agent@1.5.0
      - run: npm run check
      - run: npm test
        env:
          PI_TEST_AI_DIR: ${{ github.workspace }}/node_modules/@earendil-works/pi-ai
